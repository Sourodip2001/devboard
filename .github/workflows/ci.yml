name: frontend ci

on:
  push:
    branches:
      - master
    # paths:
    #   - frontend
  pull_request:
    branches:
      - master
  
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
    - name: code checkout
      uses: actions/checkout@v7
    - name: seup nodejs
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json   
    - name: install packeages
      run: npm --prefix frontend/package-lock.json  install 
      working-directory: frontend
    - name: run linter
      run: npm run lint   
    - name: test
      run: npm run test
