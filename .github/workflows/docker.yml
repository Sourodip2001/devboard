name: docker scan 
on: 
  workflow_call:
jobs:
  docker-file-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: 
        folders: ['backend','frontend']
    steps:
      - name: code checkout 
        uses: actions/checkout@v7
      - name: docker file lint 
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile:  ${{ matrix.folders }}/Dockerfile
      - name: docker login
        uses: docker/login-action@v4 
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build docker ${{ matrix.folders }}
        run: docker build -d ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:latest .
        working-directory: ${{ matrix.folders }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:latest 
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH' 

        