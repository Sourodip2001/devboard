name: code Quality
on:
  workflow_call:
jobs:
  sast: 
    # strategy:
    #   fail-fast: false
    #   matrix: 
    #     languages: ['node','go']
    runs-on: ubuntu-latest
    steps: 
    - name: code checkout 
      uses: actions/checkout@v7
    - name: seup nodejs
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json  
    - name: install packeages
      run: npm install 
    - name: run linter
      run: npm run lint  
    - name: seup go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'
        go-version-file: 'go.mod'
        check-latest: false  
        cache-dependency-path: go.sum
    - name: go formater
      run: go fmt
      # working-directory: frontend
    - name: run go vet
      run: go vet   