name: secret Scanning
on:
  workflow_call:
jobs:
    scan:
      runs-on: ubuntu-latest
      steps: 
        - name: code checkout
          uses: actions/checkout@v7
        - name:  GitLeaks
          uses: actions/checkout@v6
          with:
            fetch-depth: 0
        - uses: gitleaks/gitleaks-action@v3
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
