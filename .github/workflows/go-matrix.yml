# install multiple version of go and linting for that

name: Go lint 
on:
  workflow_dispatch:
jobs:
  lint: 
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: 
        go-version: ['1.22','1.23','1.24']
    steps:
      - name: checkout code 
        uses: actions/checkout@v7
      - name: seup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{matrix.go-version}}
          go-version-file: 'go.mod'
          check-latest: false  
          cache-dependency-path: go.sum
      - name: go formater
        run: go fmt
      # working-directory: fronte  nd
      - name: run go vet
        run: go vet
