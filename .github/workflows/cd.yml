# deploy image from ci steps once the ci work flow is succeed

name: CD 
on:
  workflow_call: 
    workflows: ["CI"]
    types: [completed]
    branches:  
      - 'master'
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: code checkout 
        uses: actions/checkout@v7
      - name: copy example env to main env 
        run: cp .env.example .env 
      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: deploy the container as docker compose 
        run: |
          docker compose pull 
          docker compose up -d 
    
