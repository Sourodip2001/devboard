name: frontend ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - name: code checkout
      uses: actions/checkout@v7
    - name: seup nodejs
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json   
    - name: Fix Vite React dependency
      run: |
          npm uninstall @vitejs/plugin-react
          npm install -D @vitejs/plugin-react@^6.3.0
    - name: install packeages
      run: npm install 
      # working-directory: frontend
    - name: run linter
      run: npm run lint   
      # working-directory: frontend
    - name: test
      run: npm run test
      # working-directory: frontend
    - name: docker login
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-fe-master:latest


  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - name: code checkout
      uses: actions/checkout@v7
    - name: seup go
      uses: actions/setup-go@v6
      with:
        go-version: '1.23'
        go-version-file: 'go.mod'
        check-latest: false  
        cache-dependency-path: go.sum
    - name: go formater
      run: go fmt
      # working-directory: frontend
    - name: run go vet
      run: go vet   
      # working-directory: frontend
    - name: test
      run: go test
      # working-directory: frontend
    - name: docker login
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-be-master:latest
