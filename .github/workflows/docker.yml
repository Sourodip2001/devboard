name: docker scan 
on: 
  workflow_call:
jobs:
  docker-file-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: 
        folders: ['backend','frontend']
    steps:
      - name: code checkout 
        uses: actions/checkout@v7
      - name: docker file lint 
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile:  ${{ matrix.folders }}/Dockerfile
        
  docker-image-scan:
    runs-on: ubuntu-latest
    needs: 
      - docker-file-lint