name: dependency Scanning
on:
  workflow_call:
jobs:
  dependency-scan-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: code checkout 
        uses: actions/checkout@v7
      - name: seup go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          go-version-file: 'go.mod'
          check-latest: false  
          cache-dependency-path: go.sum
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: go vul check 
        run: govulncheck ./... > go-vul-check.txt
        continue-on-error: true
        working-directory: backend
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-go-scan-report
          path: reports/go-vul-check.txt
          retention-days: 5

  dependency-check-node: 
    runs-on: ubuntu-latest
    defaults: 
      run: 
        working-directory: frontend 
    steps: 
    - name: Checkout code 
      uses: actions/checkout@v7 
    - name: seup nodejs
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json   
    - name: Fix Vite React dependency
      run: |
          npm uninstall @vitejs/plugin-react
          npm install -D @vitejs/plugin-react@^6.3.0
    - name: install packeages
      run: npm install 
    - name: run npm audit
      run: npm audit > npm-check-report.txt 
      continue-on-error: true
      working-directory: frontend
    - name: Upload Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-scan-report
        path: reports/npm-check-report.txt 
        retention-days: 5
    
    
